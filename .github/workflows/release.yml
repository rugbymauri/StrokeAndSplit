# GitHub release with a debug-signed universal APK and a Linux AppImage for version tags
# vX.Y.Z on main. README, section "CI und Releases".
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

env:
  # File name of the packages, see build.yml.
  APP_NAME: strokesplit

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag is on main
        run: |
          git fetch --quiet origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to ${GITHUB_SHA::8}, which is not on main. Releases are only made from main."
            exit 1
          fi
      - name: Release does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")
          case "$status" in
            404) ;;
            200) echo "::error::Release $GITHUB_REF_NAME already exists. Published releases are not overwritten, tag a new version instead."; exit 1 ;;
            *) echo "::error::Could not check whether release $GITHUB_REF_NAME exists (HTTP $status)."; exit 1 ;;
          esac
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  check:
    uses: ./.github/workflows/check.yml

  build:
    needs: verify-tag
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.verify-tag.outputs.version }}
      release: true
      retention-days: 1
    secrets:
      ANDROID_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}

  # Third-party code without write permissions: the release notes are only passed on as text.
  notes:
    needs: verify-tag
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.cliff.outputs.content }}
    steps:
      # The whole history, for the commits since the previous tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Collect the changes since the previous version (cliff.toml)
        id: cliff
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          version: v2.14.2
          args: --latest --strip all

  release:
    needs: [verify-tag, check, build, notes]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance (actions/attest): signing certificate, attestation, storage record.
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      VERSION: ${{ needs.verify-tag.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Attest the build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Write the release notes
        env:
          CHANGES: ${{ needs.notes.outputs.changes }}
          NOTES_DIR: ${{ runner.temp }}
        run: |
          {
            echo "Stroke & Split $VERSION, built from commit $GITHUB_SHA."
            echo
            echo "- Android: universal APK. Signed with the shared debug key of the pipeline, not suitable for the Play Store. Allow installing from unknown sources."
            echo "- Linux: AppImage for x86_64, needs GTK 3. Make it executable with \`chmod +x\` and start it."
            echo
            echo "Check the origin of a file with \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`."
            echo
            echo "## Changes"
            echo
            printf '%s\n' "$CHANGES"
          } > "$NOTES_DIR/release-notes.md"
      - name: Create release ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_DIR: ${{ runner.temp }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file "$NOTES_DIR/release-notes.md" \
            "dist/$APP_NAME-$VERSION-android.apk" "dist/$APP_NAME-$VERSION-x86_64.AppImage"
