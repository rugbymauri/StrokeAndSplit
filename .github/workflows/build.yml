# Builds the universal APK and the Linux AppImage, called by ci.yml (to find build errors before
# a release) and release.yml (the published files). README, section "CI und Releases".
name: Build

on:
  workflow_call:
    inputs:
      version:
        description: Version name of the packages and their files (empty for CI builds)
        type: string
        default: ""
      release:
        description: >
          Release build: signs the APK with the shared debug key (fails without it) and builds
          without caches, so that no poisoned cache ends up in a published file.
        type: boolean
        default: false
      retention-days:
        type: number
        default: 7
    secrets:
      ANDROID_DEBUG_KEYSTORE:
        required: false

permissions:
  contents: read

env:
  # Binary and file name, the same as in linux/CMakeLists.txt and tool/build_appimage.sh.
  APP_NAME: strokesplit
  APPLICATION_ID: ch.strokesplit.strokesplit
  VERSION: ${{ inputs.version }}
  CACHE: ${{ !inputs.release }}

jobs:
  apk:
    runs-on: ubuntu-latest
    container: ghcr.io/cirruslabs/flutter:3.44.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
        with:
          cache: ${{ env.CACHE }}
      - run: echo "GRADLE_USER_HOME=$PWD/.gradle" >> "$GITHUB_ENV"
      - if: ${{ !inputs.release }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .gradle
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Install the shared debug keystore
        if: inputs.release
        env:
          ANDROID_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -z "${ANDROID_DEBUG_KEYSTORE:-}" ]; then
            echo "::error::Secret ANDROID_DEBUG_KEYSTORE (Base64-encoded debug keystore) is missing. Without it the APK would get a random key and could not update earlier releases. See README, section \"CI und Releases\"."
            exit 1
          fi
          mkdir -p ~/.android
          # Secrets are text, so the keystore is kept Base64-encoded.
          printf '%s' "$ANDROID_DEBUG_KEYSTORE" | base64 --decode > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey > /dev/null
      - run: make deps
      - run: make apk BUILD_NAME="$VERSION" BUILD_NUMBER="$GITHUB_RUN_NUMBER"
      - run: |
          mkdir -p build/dist
          cp build/app/outputs/flutter-apk/app-release.apk "build/dist/$APP_NAME-${VERSION:-dev}-android.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk
          path: build/dist/
          retention-days: ${{ inputs.retention-days }}

  appimage:
    runs-on: ubuntu-latest
    container: ghcr.io/cirruslabs/flutter:3.44.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
        with:
          cache: ${{ env.CACHE }}
      - name: Install the Linux build tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev file desktop-file-utils > /dev/null
      - run: make deps
      - run: make build-linux BUILD_NAME="$VERSION" BUILD_NUMBER="$GITHUB_RUN_NUMBER"
      - run: make appimage BUILD_NAME="$VERSION"
      - run: |
          mkdir -p build/dist
          cp build/appimage/*.AppImage "build/dist/$APP_NAME-${VERSION:-dev}-x86_64.AppImage"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage
          path: build/dist/
          retention-days: ${{ inputs.retention-days }}
