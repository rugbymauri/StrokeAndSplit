# Analysis and tests for pull requests and main, and a check that the generated files are
# committed. Releases: see release.yml.
# README, section "CI und Releases".
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Started by hand ("Run workflow", `gh workflow run ci.yml --ref <branch>`) on any branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    uses: ./.github/workflows/check.yml

  generated:
    runs-on: ubuntu-latest
    container: ghcr.io/cirruslabs/flutter:3.44.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      # The checkout belongs to the runner user, git in the container runs as root.
      - run: git config --global --add safe.directory "$PWD"
      - run: make deps
      - run: make check-generated
