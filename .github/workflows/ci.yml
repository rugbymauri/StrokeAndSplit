# Analysis and tests for pull requests and main, a check that the generated files are committed,
# and the APK and AppImage builds (in pull requests only when build files change). Releases: see
# release.yml.
# README, section "CI und Releases".
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Started by hand ("Run workflow", `gh workflow run ci.yml --ref <branch>`) on any branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    uses: ./.github/workflows/check.yml

  generated:
    runs-on: ubuntu-latest
    container: ghcr.io/cirruslabs/flutter:3.44.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      # The checkout belongs to the runner user, git in the container runs as root.
      - run: git config --global --add safe.directory "$PWD"
      - run: make deps
      - run: make check-generated

  # Which parts a pull request touches; pushes to main and manual runs build everything.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            build:
              - android/**
              - linux/**
              - assets/**
              - pubspec.yaml
              - pubspec.lock
              - packages/*/pubspec.yaml
              - Makefile
              - tool/build_appimage.sh
              - .github/workflows/build.yml
              - .github/actions/**

  build:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.build == 'true') }}
    uses: ./.github/workflows/build.yml
